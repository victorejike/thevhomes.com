services:
  - type: web
    name: thevhomes-api
    env: docker
    plan: starter
    dockerfilePath: ./backend/Dockerfile
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: PORT
        value: 8080
      - key: FRONTEND_URL
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: thevhomes-db
          property: connectionString
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: REDIS_URL
        sync: false
      - key: CLOUDFLARE_R2_BUCKET
        sync: false
      - key: CLOUDFLARE_R2_ACCESS_KEY
        sync: false
      - key: CLOUDFLARE_R2_SECRET_KEY
        sync: false
      - key: CLOUDFLARE_R2_ENDPOINT
        sync: false
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: FLUTTERWAVE_SECRET_KEY
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: GOOGLE_MAPS_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: GOOGLE_OAUTH_CLIENT_ID
        sync: false
      - key: GOOGLE_OAUTH_CLIENT_SECRET
        sync: false
      - key: GOOGLE_OAUTH_REDIRECT_URL
        sync: false
      - key: VERIFYME_API_KEY
        sync: false
      - key: VERIFYME_BASE_URL
        value: https://vapi.verifyme.ng/v1
      - key: ENCRYPTION_KEY
        generateValue: true
      - key: AGENT_NUMBER_PREFIX
        value: TVH-AGT
      - key: QR_CODE_SERVICE_BASE_URL
        value: https://api.qrserver.com/v1/create-qr-code/
      - key: SMTP_FROM
        value: TheVHomes <no-reply@thevhomes.com>

databases:
  - name: thevhomes-db
    plan: starter
    databaseName: thevhomes
    user: thevhomes
